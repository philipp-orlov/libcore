name: ci
on: [push, pull_request]
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -j2
      - name: Install and use
        run: |
          cmake --install build --prefix "$PWD/prefix"
          test -f prefix/lib/cmake/libcore/libcoreConfig.cmake
  asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCORE_SANITIZE=address,undefined
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure -j2
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCORE_SANITIZE=thread
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure -j2
  gcc9-c++17:
    # The oldest toolchain the components must build with (JetPack 5 ships GCC 9).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-9
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-9
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure -j2
